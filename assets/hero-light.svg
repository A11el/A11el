<svg width="1280" height="400" viewBox="0 0 1280 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abel Yifru — full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCFBF8"/>
      <stop offset="0.55" stop-color="#F5F8F6"/>
      <stop offset="1" stop-color="#EEF5F3"/>
    </linearGradient>
    <radialGradient id="glow-teal" cx="0" cy="0" r="1" gradientTransform="translate(1110 -60) rotate(132) scale(520 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="0" cy="0" r="1" gradientTransform="translate(780 440) rotate(-55) scale(440 310)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="name-fill" x1="80" y1="138" x2="480" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A1220"/>
      <stop offset="1" stop-color="#26364D"/>
    </linearGradient>
    <linearGradient id="rule" x1="80" y1="211" x2="188" y2="211" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D9488"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#0F172A" stroke-opacity="0.038"/>
    </pattern>
    <filter id="panel-shadow" x="760" y="20" width="520" height="380" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <rect width="1280" height="400" fill="url(#glow-teal)"/>
  <rect width="1280" height="400" fill="url(#glow-violet)"/>

  <g>
    <rect x="80" y="52" width="92" height="30" rx="15" fill="#0D9488" fill-opacity="0.07" stroke="#0D9488" stroke-opacity="0.24"/>
    <circle cx="98" cy="67" r="3.5" fill="#0D9488"/>
    <text x="108" y="72" fill="#0F766E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.7">A11EL</text>
  </g>

  <text x="80" y="186" fill="url(#name-fill)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="750" letter-spacing="-2.2">Abel Yifru</text>
  <rect x="80" y="209" width="108" height="5" rx="2.5" fill="url(#rule)"/>

  <text x="82" y="254" fill="#0F766E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="-0.4">Full-stack developer</text>
  <text x="82" y="291" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400">I build calm, dependable software for complex work.</text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.1">
    <rect x="80" y="332" width="118" height="30" rx="7" fill="#0F172A" fill-opacity="0.035" stroke="#0F172A" stroke-opacity="0.09"/>
    <text x="96" y="351" fill="#334155">TYPESCRIPT</text>
    <rect x="208" y="332" width="92" height="30" rx="7" fill="#0F172A" fill-opacity="0.035" stroke="#0F172A" stroke-opacity="0.09"/>
    <text x="224" y="351" fill="#334155">NEXT.JS</text>
    <rect x="310" y="332" width="113" height="30" rx="7" fill="#0F172A" fill-opacity="0.035" stroke="#0F172A" stroke-opacity="0.09"/>
    <text x="326" y="351" fill="#334155">POSTGRES</text>
  </g>

  <g filter="url(#panel-shadow)">
    <rect x="820" y="62" width="380" height="280" rx="24" fill="#FFFFFF" stroke="#0F172A" stroke-opacity="0.09"/>
    <rect x="820.5" y="62.5" width="379" height="279" rx="23.5" stroke="#FFFFFF" stroke-opacity="0.8"/>
  </g>

  <text x="856" y="101" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="2.4">WHAT I DO</text>
  <line x1="856" y1="119" x2="1164" y2="119" stroke="#0F172A" stroke-opacity="0.08"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <circle cx="870" cy="153" r="13" fill="#0D9488" fill-opacity="0.09" stroke="#0D9488" stroke-opacity="0.22"/>
    <text x="870" y="157" text-anchor="middle" fill="#0F766E" font-size="9.5" font-weight="700">01</text>
    <text x="896" y="151" fill="#0F172A" font-size="17" font-weight="600">Product interfaces</text>
    <text x="896" y="172" fill="#64748B" font-size="12">fast, quiet, clear</text>

    <circle cx="870" cy="209" r="13" fill="#7C3AED" fill-opacity="0.09" stroke="#7C3AED" stroke-opacity="0.22"/>
    <text x="870" y="213" text-anchor="middle" fill="#6D28D9" font-size="9.5" font-weight="700">02</text>
    <text x="896" y="207" fill="#0F172A" font-size="17" font-weight="600">APIs &amp; data models</text>
    <text x="896" y="228" fill="#64748B" font-size="12">typed end to end</text>

    <circle cx="870" cy="265" r="13" fill="#D97706" fill-opacity="0.09" stroke="#D97706" stroke-opacity="0.22"/>
    <text x="870" y="269" text-anchor="middle" fill="#B45309" font-size="9.5" font-weight="700">03</text>
    <text x="896" y="263" fill="#0F172A" font-size="17" font-weight="600">Ship &amp; operate</text>
    <text x="896" y="284" fill="#64748B" font-size="12">containers, caching, metrics</text>
  </g>

  <line x1="870" y1="169" x2="870" y2="193" stroke="#0F172A" stroke-opacity="0.08" stroke-dasharray="2 5"/>
  <line x1="870" y1="225" x2="870" y2="249" stroke="#0F172A" stroke-opacity="0.08" stroke-dasharray="2 5"/>

  <line x1="856" y1="302" x2="1164" y2="302" stroke="#0F172A" stroke-opacity="0.08"/>
  <text x="856" y="328" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" letter-spacing="0.3">github.com/A11el</text>
  <path d="M1152 322L1159 328L1152 334" stroke="#0F766E" stroke-opacity="0.75" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
